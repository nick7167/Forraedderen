<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Kamæleon app icon, in the "Pressing" design system.

    Replaces a generic indigo game controller on #0f172a that had nothing to do with the
    app. The geometry is the system's own: an ink-900 field, the asymmetric chamfered
    plate (cuts at top-left and bottom-right — the same shape as `.plate` in index.css and
    Card `you`), and the mark knocked out of it in ink so it reads at 16px.

    Side profile rather than top-down: a chameleon is recognised by its silhouette — the
    coiled tail, the arched back and the casque over the skull — and a top-down version
    reads as a beetle at any size.

    Gold rather than teal because gold is the brand/primary colour, and the icon is the
    one place the app gets to be loud.
  -->
  <rect width="512" height="512" fill="#0e1017"/>

  <!-- The plate. Inset 48px; the chamfer is 22% of the plate's own width — the square
       form, matching the rank-emblem plate rather than the absolute plate-cut token. -->
  <path d="M139.5 48 H464 V372.5 L372.5 464 H48 V139.5 Z" fill="#f0b429"/>

  <g stroke="#0e1017" stroke-linecap="round" stroke-linejoin="round">
    <!-- Coiled tail. The single most identifying feature, so it gets real weight. -->
    <path d="M186 300 C 152 306, 132 342, 152 368 C 174 396, 220 384, 220 352 C 220 332, 200 324, 188 336"
          stroke-width="21" fill="none"/>

    <!-- Gripping feet. Chameleons have mitten toes; two forked stubs is enough to say it. -->
    <path d="M296 300 L292 348 M292 348 L276 366 M292 348 L308 366" stroke-width="18" fill="none"/>
    <path d="M214 302 L204 346 M204 346 L188 362 M204 346 L220 362" stroke-width="18" fill="none"/>

    <!-- Body, head and casque, as one silhouette. -->
    <path d="M404 266
             L376 232
             C 368 214, 350 184, 336 172
             C 328 166, 316 170, 312 182
             C 306 198, 300 206, 288 210
             C 244 224, 202 254, 188 296
             C 184 308, 194 316, 206 314
             C 244 308, 292 306, 310 294
             C 320 288, 326 278, 334 274
             Z"
          fill="#0e1017" stroke-width="2"/>
  </g>

  <!-- The turret eye, knocked back out in gold with an ink pupil. -->
  <circle cx="352" cy="240" r="15" fill="#f0b429"/>
  <circle cx="354" cy="240" r="6" fill="#0e1017"/>
</svg>
