server {
    listen 80;
    server_name ea284c1e1.vm.internal;

    root /home/ubuntu/github_repos/Forraedderen/dist;
    index index.html;

    add_header Cache-Control "max-age=0, s-maxage=60";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
